<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EasyArt login</title>

    <link rel="stylesheet" href="easy_art_log_in_page_style.css">

</head>

<body>
    
    <header> 

       <a href="easy_art_home_page.html"><div class="Easy_art_logo"> <img src="easyart_logo_small.jpg" alt="Easy_art_logo" id="logo"> </div></a>

        <h1 class="header-title">EasyArt.net</h1>
        
    </header>

    <div class="signup-container">

        <h2>Login</h2>

        <form action="easyart_loginpage.html" method="post">

            

                <label for="Email" placeholder="Enter Email"> Email: </label>

                <input type="email" id="Email" name="Email" required>

            

                <label for="password"> Password: </label>

                <input type="password" id="password" name="password" required id="input_box">

                <button type="submit" class="submit-btn">Log in</button>
            
            <div class="form-options">
                <a href="#">Forget password?</a>
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me?</span>
                </label>
            </div>

            <div class="signup-text">
                <a href="easy_art_sign_in1_page.html">Don't have account? Sign up for free</a>
            </div>

        </form>
    </div>

</body>

</html>
