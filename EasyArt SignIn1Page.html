<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyArt.net - Create an Account</title>

    <link rel="stylesheet" href="EasyArt SignIn1Page style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="EasyArt HomePage.html"><div class="EasyArtlogo"> <img src="EasyArt Logosmall.jpg" alt="EasyArtlogo" id="logo"> </div></a>
        <h2>EasyArt.net</h2>
    </header>

    <!-- Sign-up -->
    <main class="signup-container">

        <h1>Create an account</h1>

        <p class="login-link">
            <a href="EasyArt LogInPage.html">Already have an account? Log in</a>
        </p>

        <form id="account-form" action="EasyArt SignIn2Page.html" method="get">

            <!-- Email address -->
            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    aria-describedby="email-error"
                    required
                >
                <p class="form-error" id="email-error">Enter a valid email address.</p>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="8"
                    pattern="(?=.*[0-9]).{8,}"
                    aria-describedby="password-hint password-error"
                    required
                >
                <p class="form-hint" id="password-hint">Use at least 8 characters, including one digit.</p>
                <p class="form-error" id="password-error">Your password needs at least 8 characters and one digit.</p>
            </div>

            <!-- Phone number -->
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    autocomplete="tel-national"
                    inputmode="numeric"
                    minlength="8"
                    pattern="[0-9]{8}"
                    aria-describedby="phone-hint phone-error"
                    required
                >
                <p class="form-hint" id="phone-hint">Use 8 digits without spaces or a country code.</p>
                <p class="form-error" id="phone-error">Enter exactly 8 digits.</p>
            </div>

            <!-- Terms of service -->
            <a href="https://www.youtube.com/watch?v=lnHKfltA_q0" class="terms-link">
                Terms of service
            </a>

            <!-- Consent options -->
            <div class="checkbox-group">

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                        required
                    >
                    <span>
                        I have read and accept the Terms of Service and Privacy Policy.
                    </span>
                </label>

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                    >
                    <span>
                        I want to receive news about the latest changes at EasyArt.
                    </span>
                </label>

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                    >
                    <span>
                        Allow EasyArt to send me messages and emails about offers and products.
                    </span>
                </label>
            </div>

            <!-- Submit button -->
            <button type="submit">Confirm </button>
        </form>
    </main>
</body>
</html>
