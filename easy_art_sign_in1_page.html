<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyArt.net - Create an Account</title>

    <link rel="stylesheet" href="easy_art_sign_in1_page_style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="easy_art_home_page.html"><div class="Easy_art_logo"> <img src="easyart_logo_small.jpg" alt="Easy_art_logo" id="logo"> </div></a>
        <h2>EasyArt.net</h2>
    </header>

    <!-- Sign-up -->
    <main class="signup-container">

        <h1>Create an account</h1>

        <p class="login-link">
            <a href="easy_art_log_in_page.html">Already have an account?Log-in</a>
        </p>

        <form action="#" method="post">

            <!-- Email address -->
            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <!-- Confirm password -->
            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <!-- Phone number -->
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required
                >
            </div>

            <!-- Terms of service -->
            <a href="https://www.youtube.com/watch?v=lnHKfltA_q0" class="terms-link">
                Terms of service
            </a>

            <!-- Consent options -->
            <div class="checkbox-group">

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                        name="accept-terms"
                        required
                    >
                    <span>
                        I have read and accept the Terms of Service and Privacy Policy.
                    </span>
                </label>

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                        name="newsletter"
                    >
                    <span>
                        I want to receive news about the latest changes at EasyArt.
                    </span>
                </label>

                <label class="checkbox-option">
                    <input
                        type="checkbox"
                        name="marketing"
                    >
                    <span>
                        Allow EasyArt to send me messages and emails about offers and products.
                    </span>
                </label>
            </div>

            <!-- Submit button -->
             <button type="submit"><a href="easy_art_sign_in2_page.html">Confirm</a></button>
        </form>
    </main>
</body>
</html>
