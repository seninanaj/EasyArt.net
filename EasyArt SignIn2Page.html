    <title>EasyArt.net - Sign Up</title>
    <link rel="stylesheet" href="EasyArt SignIn2Page style.css">

<body>
    <header>
        <a href="EasyArt HomePage.html"><div class="EasyArtlogo"> <img src="EasyArt Logosmall.jpg" alt="EasyArtlogo" id="logo"> </div></a>
        <h2>EasyArt.net</h2>
    </header>

    <main class="signup-container">
        <h1>Create an account</h1>

        <p class="login-text">
            <a href="EasyArt LogInPage.html">Already have an account? Log in</a>
        </p>

        <dialog class="signup-dialog" open aria-label="Profile details">
            <form id="signupForm" method="dialog">

                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>

                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>

                <div class="date-row">
                    <label for="birthday">Date of birth</label>
                    <input type="date" id="birthday" name="birthday" autocomplete="bday" required>
                </div>

                <fieldset class="gender-group">
                    <legend>Gender (optional)</legend>
                    <div class="gender-options">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </fieldset>

                <div class="validated-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username"
                           minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}"
                           aria-describedby="username-hint username-error" required>
                    <p class="form-hint" id="username-hint">Use 3–20 letters (A–Z), digits or underscores.</p>
                    <p class="form-error" id="username-error">Enter 3–20 characters using A–Z, digits or underscores.</p>
                </div>

                <label for="address">Address</label>
                <input type="text" id="address" name="address" autocomplete="street-address" required>

                <label for="about">About</label>
                <textarea id="about" name="about" rows="4" maxlength="500"
                          aria-describedby="about-hint" required></textarea>
                <p class="form-hint" id="about-hint">Write a short bio, up to 500 characters.</p>


                <label for="interest">Interest in art (1–10)</label>
                <input type="range" id="interest" name="interest" min="1" max="10" value="5">
